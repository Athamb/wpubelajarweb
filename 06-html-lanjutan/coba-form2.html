<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contoh Input Atribut, Checkbox & Radio</title>
  </head>
  <body>
    <h1>Contoh Input Atribut, Checkbox & Radio</h1>
    <form>
      <label for="name"
        >Nama:
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Masukkan Nama"
          autocomplete="off"
          autofocus
          required
        />
      </label>
      <br />

      <h3>Hobi:</h3>
      <label for="hobi1">
        <input type="checkbox" name="hobi1" id="hobi1" value="olahraga" />
        Olahraga
      </label>
      <br />

      <label for="hobi2">
        <input type="checkbox" name="hobi2" id="hobi2" value="senam" />
        Senam
      </label>
      <br />

      <h3>Jenis Kelamin</h3>
      <label for="pria">
        <input
          type="radio"
          name="jenis_kelamin"
          id="pria"
          value="pria"
          checked
        />
        Pria
      </label>
      <br />

      <label for="wanita">
        <input type="radio" name="jenis_kelamin" id="wanita" value="wanita" />
        Wanita
      </label>
      <br />

      <button type="submit">Kirim</button>
    </form>
  </body>
</html>
