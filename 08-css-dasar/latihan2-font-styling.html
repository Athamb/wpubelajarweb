<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quote</title>
    <style>
      body {
        font-family: "Courier New", Courier, monospace;
        font-weight: bold;
        color: rgb(56, 56, 56);
        text-align: center;
      }

      h1 {
        font-size: 48px;
        text-transform: uppercase;
        font-style: italic;
        letter-spacing: 10px;
        text-decoration: underline;
        text-decoration-style: wavy;
        text-decoration-color: darkgray;
        text-shadow: 5px 5px 0 rgb(215, 215, 215);
      }

      .quote {
        font-size: 22px;
        line-height: 2.2;
        word-spacing: 5px;
      }

      span {
        color: rgb(215, 215, 215);
        text-decoration: line-through;
      }

      .credit {
        font-size: 12px;
        letter-spacing: 2px;
        color: rgb(170, 170, 170);
        font-weight: normal;
      }
    </style>
  </head>
  <body>
    <h1>fase runtuh</h1>
    <p class="quote">
      "Fase runtuh" adalah istilah yang digunakan untuk <br />
      <span>menggambarkan</span> tahap atau periode di mana suatu sistem, <br />
      struktur, atau organisasi mengalami penurunan, keruntuhan, atau kegagalan.
      <br />
    </p>
    <p class="credit">- john pork</p>
  </body>
</html>
