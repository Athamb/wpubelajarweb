<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiple Background</title>
    <style>
      body {
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background-color: #333;
      }

      .frame {
        width: 400px;
        height: 400px;
        border: 10px solid white;
        margin: auto;
        background-image:
          url(img/monster.png), url(img/boom.png), url(img/banner-img.png);
        background-size: 300px, 500px, 500px;
        background-repeat: no-repeat, no-repeat, no-repeat;
        background-position:
          center 30%,
          center,
          bottom left;
        background-color: #f0f0f0;
        border-radius: 10%;
      }

      h1 {
        color: #fff;
        text-align: center;
        font-family: "Courier New", Courier, monospace;
        font-size: 40px;
        text-shadow: 2px 2px 4px black;
      }
    </style>
  </head>
  <body>
    <h1>My Profile Card</h1>
    <div class="frame"></div>
  </body>
</html>
